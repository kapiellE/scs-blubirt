<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCS-T1 – terminal funkcjonariusza (symulator)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{padding:8px}
.wrap{width:100%;max-width:560px;margin:0 auto;overflow:hidden}
.dev{position:relative;width:140%;margin-left:-22.8%;container-type:inline-size;line-height:0}
.dev>img{display:block;width:100%;height:auto}
.badge{position:absolute;left:53.6%;top:87.3%;transform:translate(-50%,-50%);display:flex;gap:1.1cqw;align-items:center;color:#d8d8d8;font:700 2.1cqw/1 system-ui,Arial,sans-serif;letter-spacing:.14em;background:#1e1e20;padding:.6cqw 1.6cqw;border-radius:.6cqw}
.badge svg{width:2.6cqw;height:2.6cqw}
.scr{position:absolute;left:33.8%;top:16.5%;width:39.7%;height:66.5%;background:#000;overflow:hidden;border-radius:2px}
.ui{position:absolute;left:0;top:0;width:320px;height:567px;transform-origin:0 0;background:#f3f6fa;color:#12263f;font:13px/1.35 system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.ui input,.ui textarea,.ui select{user-select:text;-webkit-user-select:text}
#sb{position:absolute;left:0;right:0;top:0;height:20px;background:#061a38;color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:5;cursor:pointer}
#sb b{font-size:11px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#43d17a;margin-right:4px}
.dot.off{background:#9aa7b5}
#demo{position:absolute;left:0;right:0;top:20px;height:14px;background:#ffe9a8;color:#5a4300;font-size:8.5px;font-weight:700;letter-spacing:.02em;text-align:center;line-height:14px;z-index:5;white-space:nowrap;overflow:hidden}
#pg{position:absolute;left:0;right:0;top:34px;bottom:0}
.mh{height:52px;background:#0b2a55;color:#fff;display:flex;align-items:center;gap:8px;padding:0 10px}
.mh svg{width:34px;height:34px;flex:none}
.mt{font-weight:700;font-size:11px;letter-spacing:.04em;line-height:1.2;flex:1}
.mr{text-align:right;font-size:10px;line-height:1.3}.mr b{display:block;font-size:11px}
.hd{height:40px;background:#0b2a55;color:#fff;display:flex;align-items:center;gap:8px;padding:0 8px}
.hd h2{margin:0;font-size:12.5px;flex:1;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{width:32px;height:28px;background:#1976d2;color:#fff;border:0;border-radius:6px;font-size:17px;line-height:1;cursor:pointer}
.bd{position:absolute;top:40px;left:0;right:0;bottom:0;padding:10px;overflow:auto}
.bd.mn{top:52px;padding:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:70px;gap:6px}
.tile{position:relative;background:#1565c0;color:#fff;border:0;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 6px;cursor:pointer;font:inherit;font-size:10.5px;font-weight:700;letter-spacing:.03em;line-height:1.15;text-align:center;box-shadow:0 2px 0 #0d47a1}
.tile:active{background:#0d47a1;transform:translateY(1px);box-shadow:none}
.tile svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile i{position:absolute;right:6px;top:5px;background:#ffb300;color:#222;border-radius:9px;padding:0 6px;font-style:normal;font-size:10px}
.btn{background:#1565c0;color:#fff;border:0;border-radius:6px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer}
.btn:active{background:#0d47a1}
.btn.sec{background:#e1e8f1;color:#0b2a55}.btn.red{background:#c62828}.btn.sm{padding:6px 10px;font-size:12px}
.btn.cur{background:#0b2a55;outline:2px solid #ffb300}
.bar{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.id{font-size:11px;color:#5b6f86}
.it{background:#fff;border:1px solid #d5dde8;border-left:5px solid #1565c0;border-radius:6px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.it .g1{display:flex;justify-content:space-between;gap:6px;font-size:12.5px}
.it .g2{color:#40566f;font-size:12px;margin-top:1px}
.it .g3{display:flex;gap:10px;font-size:11px;color:#5b6f86;margin-top:2px}
.it.un{border-left-color:#ef8f00}.it.un b{color:#b35c00}
.em{color:#5b6f86;padding:18px;text-align:center}
.card{background:#fff;border:1px solid #d5dde8;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:100px 1fr;gap:3px 8px;padding:4px 0;border-bottom:1px solid #eef2f7;font-size:12px}
.kv span{color:#5b6f86}.kv div{word-break:break-word}
.fm{display:flex;flex-direction:column;gap:8px}
.f{display:block;font-size:11px;color:#4a607a}
.f input,.f textarea,.f select,.inp{display:block;width:100%;margin-top:2px;padding:7px 8px;border:1px solid #9fb0c4;border-radius:5px;font:inherit;font-size:13px;background:#fff;color:#12263f}
.f textarea{resize:none}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.acts .btn{flex:1 1 45%}
.tm2{background:#e3f0ff;border:1px solid #9cc3f0;border-radius:6px;padding:6px 10px;margin-bottom:8px}
.chip{display:inline-flex;gap:6px;align-items:center;background:#e1e8f1;border-radius:12px;padding:3px 9px;margin:0 4px 4px 0;font-size:11px}
.chip button{border:0;background:none;color:#c62828;font-weight:700;cursor:pointer;padding:0}
.chip.q{cursor:pointer;background:#e3f0ff}
.res{border-radius:8px;padding:10px;margin:10px 0;font-size:12.5px}
.res.ok{background:#e4f5e8;border:1px solid #8cc99a}.res.warn{background:#fff3da;border:1px solid #e6c068}.res.bad{background:#fdeaea;border:1px solid #e19a9a}.res.none{background:#eceff3;border:1px solid #c3ccd6}
.mw{border:1px solid #9fb0c4;border-radius:8px;overflow:hidden;position:relative;background:#fff;height:210px}
#msvg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.mw .z{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px}
.mw .z .btn{padding:3px 10px;font-size:16px}
#lock{position:absolute;inset:0;z-index:20;background:linear-gradient(165deg,#0b2a55 0%,#1565c0 100%);color:#fff;text-align:center;touch-action:none;cursor:grab;transition:transform .35s ease}
#lock.drag{transition:none}
#lock .lt{margin-top:46px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;letter-spacing:.08em;font-size:13px}
#lock .lt svg{width:54px;height:54px}
#lock .tm{font-size:66px;font-weight:300;margin-top:36px;line-height:1}
#lock .ld{font-size:14px;margin-top:6px}
#lock .dv{margin-top:18px;font-size:11px;opacity:.8;letter-spacing:.12em}
#lock .hn{position:absolute;bottom:18px;left:0;right:0;font-size:12.5px}
#lock .hn i{display:block;width:54px;height:4px;border-radius:2px;background:#fff;margin:0 auto 8px}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#0b2a55;color:#fff;padding:8px 16px;border-radius:20px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;font-weight:600;font-size:12px;max-width:290px;text-align:center}
#toast.on{opacity:1}
</style>
</head>

else if(a==='vcheck'){const no=$('#vn').value.trim();if(!no)return toast('Wpisz numer dokumentu');const t=$('#vt').value,d=DOCS.find(q=>q.no.toUpperCase()===no.toUpperCase());VR=d?{no:d.no,st:d.st,info:d.info}:{no,st:'none',info:'Dokumentu nie ma w bazie demonstracyjnej (wpisz jeden z przykładów).'};S.vers.unshift({no:VR.no,st:VR.st,t:hm(new Date())});S.vers=S.vers.slice(0,12);save();render();$('#vn').value=no;$('#vt').value=t}
else if(a==='dbs'){DBQ=$('#dq').value;render()}
else if(a==='csend'){const tx=$('#ctx').value.trim();if(!tx)return toast('Wpisz treść wiadomości');S.msgs.unshift({id:'s'+Date.now(),from:'SCS-T1',to:$('#cto').value,t:now(),txt:tx,read:true});save();toast('Wiadomość wysłana (demo)');render()}
else if(a==='reply'){nav('comm');$('#cto').value=TO.includes(x)?x:TO[0];$('#ctx').focus()}
else if(a==='mode'){MODE=x;render()}
else if(a==='mz')zoom(+x);else if(a==='mc'){MV=null;render()}
else if(a==='pdel'){S.mpts=S.mpts.filter(p=>p.id!==x);save();render()}
else if(a==='setst'){setStatus(x);save();toast('Status: '+x);render()}
else if(a==='setsave'){const d=fd();S.badge=(d.badge||S.badge).trim().toUpperCase();S.set.bright=+d.bright;S.set.sound=d.sound;S.conn=d.conn;save();applyB();toast('Ustawienia zapisane');back()}
else if(a==='lock')lockIt();
else if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='scs-t1-kopia.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Kopia pobrana')}
else if(a==='imp')$('#impf').click();
else if(a==='reset'){if(b.dataset.c){S=seed();save();applyB();MV=null;VR=null;toast('Wyczyszczono wszystkie dane');stack=[['menu']];render()}else{b.dataset.c=1;b.textContent='Kliknij ponownie, aby potwierdzić'}}});
function persistAtt(){const c=cur();if(c[0]==='form'){(S.drafts[dk(c[1])]=S.drafts[dk(c[1])]||{})._att=ATT.slice();save()}}
ui.addEventListener('input',e=>{const t=e.target,c=cur();if(t.name==='bright'){S.set.bright=+t.value;applyB();$('#bv').textContent=t.value;return}
if(c[0]==='form'&&t.name){const k=dk(c[1]);(S.drafts[k]=S.drafts[k]||{})[t.name]=t.value;save()}});
ui.addEventListener('change',e=>{if(e.target.id==='atf'){[...e.target.files].forEach(f=>ATT.push({name:f.name}));$('#atl').innerHTML=attH();persistAtt();return}
if(e.target.id==='impf'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.recs)throw 0;S=o;save();applyB();MV=null;toast('Kopia wczytana');stack=[['menu']];render()}catch(x){toast('To nie jest poprawny plik kopii')}};r.readAsText(f)}});
const L=$('#lock');let y0=null,dy=0;
function lockIt(){stack=[['menu']];render();L.style.transform='';L.classList.remove('drag')}
L.addEventListener('pointerdown',e=>{y0=e.clientY;dy=0;L.classList.add('drag');L.setPointerCapture(e.pointerId)});
L.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.min(0,(e.clientY-y0)/K);L.style.transform='translateY('+dy+'px)'});
function endSw(){if(y0===null)return;y0=null;L.classList.remove('drag');L.style.transform=dy<-90?'translateY(-110%)':''}
L.addEventListener('pointerup',endSw);L.addEventListener('pointercancel',endSw);
L.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='Enter')L.style.transform='translateY(-110%)'});
render();
</script>
</body>
</html>
